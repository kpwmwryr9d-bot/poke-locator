name: Build local Pokemon card name index

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build name index from Pokemon TCG API (paginated)
        env:
          POKETCG_API_KEY: ${{ secrets.POKETCG_API_KEY }}
        run: |
          node - <<'NODE'
          const fs = require('fs');

          const API = "https://api.pokemontcg.io/v2/cards";
          const pageSize = 250; // max 250
          let page = 1;
          let totalCount = null;
          let out = [];

          async function fetchPage(p){
            const url = new URL(API);
            url.searchParams.set("page", String(p));
            url.searchParams.set("pageSize", String(pageSize));
            url.searchParams.set("select", "name,set.id,number"); // minimal fields
            const headers = {};
            if (process.env.POKETCG_API_KEY) headers["X-Api-Key"] = process.env.POKETCG_API_KEY;

            const res = await fetch(url, { headers });
            if (!res.ok) {
              const txt = await res.text();
              throw new Error(`API ${res.status}: ${txt.slice(0,300)}`);
            }
            return res.json();
          }

          (async ()=>{
            while (true) {
              const json = await fetchPage(page);
              if (totalCount === null && typeof json.totalCount === "number") totalCount = json.totalCount;

              const data = Array.isArray(json.data) ? json.data : [];
              if (!data.length) break;

              for (const c of data) {
                out.push({
                  name: c.name,
                  setId: c.set?.id || "",
                  number: c.number || ""
                });
              }

              const got = out.length;
              const more = totalCount ? got < totalCount : data.length === pageSize;
              console.log(`Fetched page ${page}, total so far: ${got}${totalCount ? " / " + totalCount : ""}`);

              if (!more) break;
              page++;
            }

            // sort by name for nicer local search
            out.sort((a,b)=> (a.name||"").localeCompare(b.name||""));

            fs.writeFileSync("card-names.min.json", JSON.stringify(out));
            console.log(`Wrote card-names.min.json with ${out.length} records`);
          })().catch(err=>{
            console.error(err);
            process.exit(1);
          });
          NODE

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add card-names.min.json
          git commit -m "Update local card name index" || echo "No changes"
          git push
