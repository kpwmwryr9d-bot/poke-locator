<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Poké Locator — Search</title>

  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#111111">

  <!-- iPhone Home Screen icon support -->
  <link rel="apple-touch-icon" href="icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    :root { --pad: 12px; --radius: 12px; }
    body { font-family: -apple-system, system-ui, sans-serif; margin: 0; background:#0b0b0b; color:#fff; }
    header { padding: var(--pad); position: sticky; top:0; background: rgba(0,0,0,.88); backdrop-filter: blur(10px); border-bottom: 1px solid #222; z-index: 2; }
    h1 { font-size: 18px; margin:0; }
    main { padding: var(--pad); display:grid; gap:12px; }
    .card { background:#131313; border:1px solid #232323; border-radius: var(--radius); padding: var(--pad); }
    .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    input, select, button, textarea {
      font-size: 16px; border-radius: 10px; border:1px solid #2a2a2a; background:#1c1c1c; color:#fff;
      padding: 10px 12px;
    }
    textarea { width:100%; min-height: 70px; }
    button { cursor:pointer; }
    button.primary { background:#2a5bd7; border-color:#2a5bd7; }
    button.good { background:#1d7f43; border-color:#1d7f43; }
    button.warn { background:#a23a3a; border-color:#a23a3a; }
    button:disabled { opacity:.55; cursor:not-allowed; }
    .pill { padding: 6px 10px; border-radius: 999px; background:#1a1a1a; border:1px solid #2a2a2a; font-size: 13px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .small { font-size: 13px; opacity:.85; }
    .hint { font-size:12px; opacity:.8; line-height:1.35; }
    .grid { display:grid; grid-template-columns: 1fr; gap:10px; }
    @media (min-width: 860px){ .grid { grid-template-columns: 1fr 1fr; } }

    .results { display:grid; gap:10px; }
    .resultItem {
      border:1px solid #2a2a2a; border-radius: 12px; padding:10px; background:#111;
      display:grid; grid-template-columns: 86px 1fr; gap:10px; align-items:start;
    }
    .thumb { width:86px; height:auto; border-radius:10px; border:1px solid #2a2a2a; background:#0a0a0a; }
    .title { font-weight:700; }
    .meta { font-size:13px; opacity:.85; margin-top:2px; }
    .actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
    .divider { border:0; border-top:1px solid #262626; margin:12px 0; }

    .toggle {
      display:flex; align-items:center; gap:8px;
      padding: 6px 10px; border-radius: 999px;
      background:#1a1a1a; border:1px solid #2a2a2a;
      font-size: 13px;
    }
    .toggle input { transform: scale(1.15); }

    .errBox {
      display:none;
      margin-top:10px;
      background:#2a1010;
      border:1px solid #6b1f1f;
      padding:10px;
      border-radius:12px;
      font-size:13px;
      white-space:pre-wrap;
    }
  </style>
</head>

<body>
<header>
  <div class="row" style="justify-content:space-between;">
    <h1>Poké Locator</h1>
    <span class="pill">Search on demand • Add custom • Save locations</span>
  </div>
</header>

<main class="grid">

  <section class="card">
    <h2 style="margin:0 0 10px 0; font-size:16px;">Search the card database</h2>

    <div class="row">
      <input id="q" placeholder="Search (e.g., Iono, Rare Candy, Boss's Orders)" style="flex:1;">
      <button id="searchBtn" class="primary">Search</button>
    </div>

    <div class="row" style="margin-top:10px;">
      <input id="set" placeholder="Set id (optional, e.g., sv3)" class="mono" style="width:170px;">
      <input id="number" placeholder="# (optional)" class="mono" style="width:130px;">

      <label class="toggle" title="Exact uses name:&quot;Iono&quot; ; otherwise contains search (name:*iono*)">
        <input type="checkbox" id="exactToggle">
        Exact
      </label>

      <select id="pageSize" style="width:150px;">
        <option value="24">24</option>
        <option value="48" selected>48</option>
        <option value="96">96</option>
        <option value="250">250 (max)</option>
      </select>

      <span id="status" class="pill">Idle</span>
    </div>

    <div class="row" style="margin-top:10px;">
      <button id="prevBtn" disabled>Prev</button>
      <button id="nextBtn" disabled>Next</button>
      <span class="pill mono" id="pagePill">Page 1</span>
      <span class="pill mono" id="totalPill">Total: —</span>
    </div>

    <div class="row" style="margin-top:10px;">
      <input id="apiKey" placeholder="Optional API key (X-Api-Key)" style="flex:1;">
      <button id="saveKey">Save Key</button>
      <button id="clearKey" class="warn">Clear</button>
    </div>

    <div class="hint" style="margin-top:8px;">
      Tip: Use <b>3+ letters</b> (or set/number). Exact is best when you know the name.
    </div>

    <div id="errBox" class="errBox"></div>

    <hr class="divider">

    <div class="small" style="margin-bottom:6px;">Choose location</div>
    <div class="row">
      <button class="pillBtn" data-loc="A-SUPPORTER">A • Supporter</button>
      <button class="pillBtn" data-loc="A-ITEM">A • Item</button>
      <button class="pillBtn" data-loc="A-TOOL_STADIUM">A • Tool/Stadium</button>
      <button class="pillBtn" data-loc="A-ENERGY_LINES">A • Energy/Lines</button>
    </div>

    <div class="small" style="margin:10px 0 6px;">Bulk chunks (75-card)</div>
    <div class="row">
      <select id="bulkRow">
        <option>B</option><option>C</option><option>D</option><option>E</option>
      </select>
      <select id="bulkChunk"></select>
      <span class="pill mono" id="selectedLoc"></span>
    </div>
  </section>

  <section class="card">
    <h2 style="margin:0 0 10px 0; font-size:16px;">Your custom cards</h2>

    <div class="row">
      <input id="customName" placeholder="Custom card name" style="flex:1;">
      <input id="customSet" placeholder="Set (optional)" class="mono" style="width:150px;">
      <input id="customNum" placeholder="# (optional)" class="mono" style="width:130px;">
    </div>
    <div style="margin-top:8px;">
      <textarea id="customNotes" placeholder="Notes (optional): proxy, misprint, etc…"></textarea>
    </div>

    <div class="row" style="margin-top:10px;">
      <button id="addCustom" class="good">Add Custom Card</button>
      <button id="exportCsv">Export CSV</button>
      <button id="wipe" class="warn">Wipe Local Data</button>
      <span class="pill">Stored on this iPhone</span>
    </div>

    <hr class="divider">

    <h2 style="margin:0 0 10px 0; font-size:16px;">Results</h2>
    <div id="results" class="results"></div>
  </section>
</main>

<script>
  // --------------------------
  // Config
  // --------------------------
  const API_BASE = "https://api.pokemontcg.io/v2/cards";
  const DB_NAME = "poke_locator_db";
  const STORE_ENTRIES = "entries";
  const STORE_CUSTOM = "custom_cards";

  // --------------------------
  // DOM
  // --------------------------
  const qEl = document.getElementById("q");
  const setEl = document.getElementById("set");
  const numEl = document.getElementById("number");
  const exactEl = document.getElementById("exactToggle");
  const pageSizeEl = document.getElementById("pageSize");

  const statusEl = document.getElementById("status");
  const resultsEl = document.getElementById("results");
  const errBox = document.getElementById("errBox");

  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");
  const pagePill = document.getElementById("pagePill");
  const totalPill = document.getElementById("totalPill");

  const selectedLocSpan = document.getElementById("selectedLoc");
  const bulkRowEl = document.getElementById("bulkRow");
  const bulkChunkEl = document.getElementById("bulkChunk");

  // --------------------------
  // Bulk chunks 01..14
  // --------------------------
  for (let i=1;i<=14;i++){
    const opt = document.createElement("option");
    opt.value = String(i).padStart(2,"0");
    opt.textContent = String(i).padStart(2,"0");
    bulkChunkEl.appendChild(opt);
  }

  // --------------------------
  // Location selection
  // --------------------------
  let selectedLoc = "";

  function bulkLoc(){
    return bulkRowEl.value + bulkChunkEl.value;
  }
  function setSelectedLoc(v){
    selectedLoc = v;
    selectedLocSpan.textContent = selectedLoc || "No location";
  }

  bulkRowEl.addEventListener("change", ()=> setSelectedLoc(bulkLoc()));
  bulkChunkEl.addEventListener("change", ()=> setSelectedLoc(bulkLoc()));

  document.querySelectorAll(".pillBtn").forEach(btn=>{
    btn.addEventListener("click", ()=> setSelectedLoc(btn.dataset.loc));
  });

  // default location
  setSelectedLoc(bulkLoc());

  // --------------------------
  // Pagination state
  // --------------------------
  let currentPage = 1;
  let lastQueryKey = "";
  let lastTotalCount = 0;

  function updatePager(){
    pagePill.textContent = `Page ${currentPage}`;
    totalPill.textContent = `Total: ${lastTotalCount ? lastTotalCount : "—"}`;
    prevBtn.disabled = (currentPage <= 1);

    const pageSize = Number(pageSizeEl.value || "48");
    const shownSoFar = currentPage * pageSize;

    // if totalCount missing, disable Next to avoid weird loops
    nextBtn.disabled = !(lastTotalCount && lastTotalCount > shownSoFar);
  }

  prevBtn.addEventListener("click", async ()=>{
    if (currentPage > 1) {
      currentPage--;
      await runSearch(true);
    }
  });
  nextBtn.addEventListener("click", async ()=>{
    const pageSize = Number(pageSizeEl.value || "48");
    if (lastTotalCount && lastTotalCount > currentPage * pageSize) {
      currentPage++;
      await runSearch(true);
    }
  });

  // reset page when filters change
  [setEl, numEl, exactEl, pageSizeEl].forEach(el=>{
    el.addEventListener("change", ()=> { currentPage = 1; });
  });

  // --------------------------
  // IndexedDB
  // --------------------------
  let db;

  function openDB(){
    return new Promise((resolve,reject)=>{
      const req = indexedDB.open(DB_NAME, 2);
      req.onupgradeneeded = ()=>{
        const d = req.result;

        if (!d.objectStoreNames.contains(STORE_ENTRIES)) {
          const s = d.createObjectStore(STORE_ENTRIES, { keyPath: "id", autoIncrement: true });
          s.createIndex("name", "name", { unique:false });
          s.createIndex("loc", "loc", { unique:false });
        }
        if (!d.objectStoreNames.contains(STORE_CUSTOM)) {
          const c = d.createObjectStore(STORE_CUSTOM, { keyPath: "id", autoIncrement: true });
          c.createIndex("name", "name", { unique:false });
        }
      };
      req.onsuccess = ()=>{ db = req.result; resolve(db); };
      req.onerror = ()=>reject(req.error);
    });
  }

  function getAll(storeName){
    return new Promise((resolve,reject)=>{
      const tx = db.transaction(storeName,"readonly");
      const req = tx.objectStore(storeName).getAll();
      req.onsuccess = ()=>resolve(req.result);
      req.onerror = ()=>reject(req.error);
    });
  }

  function addToStore(storeName, obj){
    return new Promise((resolve,reject)=>{
      const tx = db.transaction(storeName,"readwrite");
      tx.objectStore(storeName).add(obj);
      tx.oncomplete = ()=>resolve();
      tx.onerror = ()=>reject(tx.error);
    });
  }

  function deleteFromStore(storeName, id){
    return new Promise((resolve,reject)=>{
      const tx = db.transaction(storeName,"readwrite");
      tx.objectStore(storeName).delete(id);
      tx.oncomplete = ()=>resolve();
      tx.onerror = ()=>reject(tx.error);
    });
  }

  async function wipeAll(){
    await new Promise((resolve,reject)=>{
      const tx = db.transaction(STORE_ENTRIES,"readwrite");
      const req = tx.objectStore(STORE_ENTRIES).clear();
      req.onsuccess = ()=>resolve();
      req.onerror = ()=>reject(req.error);
    });
    await new Promise((resolve,reject)=>{
      const tx = db.transaction(STORE_CUSTOM,"readwrite");
      const req = tx.objectStore(STORE_CUSTOM).clear();
      req.onsuccess = ()=>resolve();
      req.onerror = ()=>reject(req.error);
    });
  }

  // --------------------------
  // API key
  // --------------------------
  const apiKeyInput = document.getElementById("apiKey");
  apiKeyInput.value = localStorage.getItem("poke_api_key") || "";

  document.getElementById("saveKey").addEventListener("click", ()=>{
    localStorage.setItem("poke_api_key", apiKeyInput.value.trim());
    setStatus("Key saved");
  });
  document.getElementById("clearKey").addEventListener("click", ()=>{
    localStorage.removeItem("poke_api_key");
    apiKeyInput.value = "";
    setStatus("Key cleared");
  });

  // --------------------------
  // Helpers
  // --------------------------
  function setStatus(s){ statusEl.textContent = s; }
  function showError(msg){
    errBox.style.display = "block";
    errBox.textContent = msg;
  }
  function clearError(){
    errBox.style.display = "none";
    errBox.textContent = "";
  }
  function escapeHtml(s){
    return (s||"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");
  }

  function normalizeName(s){
    return (s||"").toLowerCase().replace(/\s+/g," ").trim();
  }

  function subtitleFromApi(c){
    const setName = c.set?.name || "";
    const setId = c.set?.id || "";
    const num = c.number || "";
    const rarity = c.rarity || "";
    return [setName, setId ? `(${setId})` : "", num ? `#${num}` : "", rarity].filter(Boolean).join(" • ");
  }

  // Escape Lucene special chars for safety in name queries
  // (keep it simple: strip quotes, escape colon/backslash)
  function sanitizeForQuery(s){
    return (s||"")
      .replace(/"/g, "")       // remove quotes
      .replace(/\\/g, "\\\\")  // escape backslash
      .replace(/:/g, "\\:")    // escape colon
      .trim();
  }

  function buildApiQuery(){
    const nameRaw = qEl.value.trim();
    const setId = setEl.value.trim();
    const num = numEl.value.trim();
    const exact = exactEl.checked;

    const clauses = [];

    if (nameRaw) {
      const n = sanitizeForQuery(nameRaw);
      if (exact) {
        // exact phrase match
        clauses.push(`name:"${n}"`);
      } else {
        // contains style:
        // - one word => name:*word*
        // - multiple words => require each word
        const words = n.split(/\s+/).filter(Boolean);
        if (words.length === 1) {
          clauses.push(`name:*${words[0]}*`);
        } else {
          clauses.push(words.map(w => `name:*${w}*`).join(" AND "));
        }
      }
    }

    if (setId) clauses.push(`set.id:${sanitizeForQuery(setId)}`);
    if (num) clauses.push(`number:${sanitizeForQuery(num)}`);

    return clauses.join(" AND ");
  }

  async function fetchCards(query, pageSize, page){
    const url = new URL(API_BASE);
    url.searchParams.set("q", query);
    url.searchParams.set("pageSize", String(pageSize));
    url.searchParams.set("page", String(page));
    url.searchParams.set("orderBy", "name");
    url.searchParams.set("select", "id,name,set,number,images,rarity");

    const headers = {};
    const key = (localStorage.getItem("poke_api_key") || "").trim();
    if (key) headers["X-Api-Key"] = key;

    const res = await fetch(url.toString(), { headers });
    const text = await res.text();

    let json = null;
    try { json = JSON.parse(text); } catch(e) {}

    if (!res.ok) {
      const detail = json?.message || json?.error || text || `HTTP ${res.status}`;
      throw new Error(`API ${res.status}: ${detail}`);
    }

    return {
      data: json?.data || [],
      totalCount: typeof json?.totalCount === "number" ? json.totalCount : 0
    };
  }

  function renderEmpty(msg){
    resultsEl.innerHTML = `<div class="card">${escapeHtml(msg)}</div>`;
  }

  function renderCard(item){
    const img = item.image || "";
    const title = item.name || "(no name)";
    const subtitle = item.subtitle || "";
    const kindPill = item.kind === "api"
      ? `<span class="pill mono">API</span>`
      : `<span class="pill mono">CUSTOM</span>`;
    const lastPill = item.lastLoc ? `<span class="pill mono">Last: ${escapeHtml(item.lastLoc)}</span>` : "";

    const div = document.createElement("div");
    div.className = "resultItem";
    div.innerHTML = `
      <div>${img ? `<img class="thumb" src="${escapeHtml(img)}" alt="">` : `<div class="thumb"></div>`}</div>
      <div>
        <div class="title">${escapeHtml(title)} ${kindPill}</div>
        <div class="meta">${escapeHtml(subtitle)}</div>
        <div class="actions">
          <button class="good" data-action="save">Save → ${escapeHtml(selectedLoc)}</button>
          <button data-action="copy">Copy name</button>
          ${lastPill}
          ${item.kind === "custom" ? `<button class="warn" data-action="del">Delete custom</button>` : ""}
        </div>
        ${item.notes ? `<div class="meta" style="margin-top:6px;">${escapeHtml(item.notes)}</div>` : ""}
      </div>
    `;

    div.querySelector('[data-action="copy"]').addEventListener("click", async ()=>{
      await navigator.clipboard.writeText(title);
      setStatus("Copied");
    });

    div.querySelector('[data-action="save"]').addEventListener("click", async ()=>{
      if (!selectedLoc) { alert("Select a location first."); return; }
      await addToStore(STORE_ENTRIES, {
        name: title,
        loc: selectedLoc,
        ts: new Date().toISOString(),
        source: item.kind,
        cardId: item.kind === "api" ? item.id : null,
        setId: item.setId || "",
        number: item.number || ""
      });
      setStatus(`Saved to ${selectedLoc}`);
      await runSearch(true);
    });

    const delBtn = div.querySelector('[data-action="del"]');
    if (delBtn) {
      delBtn.addEventListener("click", async ()=>{
        if (confirm("Delete this custom card?")) {
          await deleteFromStore(STORE_CUSTOM, item.id);
          setStatus("Custom deleted");
          await runSearch(true);
        }
      });
    }

    resultsEl.appendChild(div);
  }

  // --------------------------
  // Search flow
  // --------------------------
  async function renderCustomOnly(){
    const customs = await getAll(STORE_CUSTOM);
    if (!customs.length) {
      renderEmpty("No results yet. Add a custom card or search by name.");
      return;
    }
    resultsEl.innerHTML = "";
    for (const c of customs) {
      renderCard({
        kind: "custom",
        id: c.id,
        name: c.name,
        subtitle: [c.setId ? `set:${c.setId}` : "", c.number ? `#${c.number}` : ""].filter(Boolean).join(" • "),
        notes: c.notes || "",
        image: "",
        setId: c.setId || "",
        number: c.number || ""
      });
    }
  }

  async function runSearch(isPaging){
    clearError();
    resultsEl.innerHTML = "";

    const nameRaw = qEl.value.trim();
    const setId = setEl.value.trim();
    const num = numEl.value.trim();

    // Guards
    if (!nameRaw && !setId && !num) {
      setStatus("Type a name (or set/number)");
      lastTotalCount = 0;
      updatePager();
      await renderCustomOnly();
      return;
    }
    if (nameRaw && nameRaw.length < 3 && !setId && !num) {
      setStatus("Type at least 3 letters (or use set/number)");
      lastTotalCount = 0;
      updatePager();
      await renderCustomOnly();
      return;
    }

    const pageSize = Number(pageSizeEl.value || "48");
    const query = buildApiQuery();

    // If query changed and not paging, reset page
    const queryKey = `${query}::${pageSize}`;
    if (!isPaging && queryKey !== lastQueryKey) currentPage = 1;
    lastQueryKey = queryKey;

    setStatus("Searching…");
    updatePager();

    // Fetch API results
    let api = { data: [], totalCount: 0 };
    try {
      api = await fetchCards(query, pageSize, currentPage);
    } catch (e) {
      setStatus("API error");
      showError(String(e.message || e));
      lastTotalCount = 0;
      updatePager();
      // still show customs so app isn't "blank"
      await renderCustomOnly();
      return;
    }

    lastTotalCount = api.totalCount || 0;
    updatePager();

    // Last locations map (by name)
    const entries = await getAll(STORE_ENTRIES);
    const lastLocByName = new Map();
    for (const e of entries) {
      const key = normalizeName(e.name);
      if (!key) continue;
      const prev = lastLocByName.get(key);
      if (!prev || e.ts > prev.ts) lastLocByName.set(key, { loc: e.loc, ts: e.ts });
    }

    // Custom matches (only filter by name text)
    const customs = await getAll(STORE_CUSTOM);
    const nameLower = nameRaw.toLowerCase();
    const customMatches = customs.filter(c => {
      if (!nameRaw) return true;
      return normalizeName(c.name).includes(normalizeName(nameLower));
    });

    // Render
    resultsEl.innerHTML = "";
    for (const c of customMatches) {
      const last = lastLocByName.get(normalizeName(c.name));
      renderCard({
        kind: "custom",
        id: c.id,
        name: c.name,
        subtitle: [c.setId ? `set:${c.setId}` : "", c.number ? `#${c.number}` : ""].filter(Boolean).join(" • "),
        notes: c.notes || "",
        image: "",
        setId: c.setId || "",
        number: c.number || "",
        lastLoc: last ? last.loc : ""
      });
    }

    for (const c of api.data) {
      const last = lastLocByName.get(normalizeName(c.name));
      renderCard({
        kind: "api",
        id: c.id,
        name: c.name,
        subtitle: subtitleFromApi(c),
        image: c.images?.small || c.images?.large || "",
        setId: c.set?.id || "",
        number: c.number || "",
        lastLoc: last ? last.loc : ""
      });
    }

    const shown = customMatches.length + api.data.length;
    setStatus(shown ? `Showing ${shown} results` : "No results");
    if (!shown) renderEmpty("No results. Try a different search or add as custom.");
  }

  // --------------------------
  // Custom add / export / wipe
  // --------------------------
  document.getElementById("addCustom").addEventListener("click", async ()=>{
    const name = document.getElementById("customName").value.trim();
    if (!name) return alert("Enter a custom card name.");
    const setId = document.getElementById("customSet").value.trim();
    const number = document.getElementById("customNum").value.trim();
    const notes = document.getElementById("customNotes").value.trim();

    await addToStore(STORE_CUSTOM, { name, setId, number, notes, created: new Date().toISOString() });

    document.getElementById("customName").value = "";
    document.getElementById("customSet").value = "";
    document.getElementById("customNum").value = "";
    document.getElementById("customNotes").value = "";

    setStatus("Custom added");
    await runSearch(false);
  });

  document.getElementById("exportCsv").addEventListener("click", async ()=>{
    const entries = await getAll(STORE_ENTRIES);
    const customs = await getAll(STORE_CUSTOM);

    const header = ["type","name","setId","number","loc","timestamp","notes","cardId"];
    const lines = [header.join(",")];

    for (const e of entries){
      const row = ["entry", e.name||"", e.setId||"", e.number||"", e.loc||"", e.ts||"", "", e.cardId||""]
        .map(v => `"${String(v).replaceAll('"','""')}"`);
      lines.push(row.join(","));
    }
    for (const c of customs){
      const row = ["custom", c.name||"", c.setId||"", c.number||"", "", c.created||"", c.notes||"", ""]
        .map(v => `"${String(v).replaceAll('"','""')}"`);
      lines.push(row.join(","));
    }

    const blob = new Blob([lines.join("\n")], { type:"text/csv" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "poke_locator_export.csv";
    a.click();
    URL.revokeObjectURL(url);
  });

  document.getElementById("wipe").addEventListener("click", async ()=>{
    if (confirm("This deletes ALL saved entries + custom cards on this iPhone. Continue?")){
      await wipeAll();
      setStatus("Wiped");
      currentPage = 1;
      lastTotalCount = 0;
      updatePager();
      await renderCustomOnly();
    }
  });

  // --------------------------
  // Search events
  // --------------------------
  document.getElementById("searchBtn").addEventListener("click", async ()=>{
    currentPage = 1;
    await runSearch(false);
  });

  qEl.addEventListener("keydown", async (e)=>{
    if (e.key === "Enter") {
      currentPage = 1;
      await runSearch(false);
    }
  });

  // --------------------------
  // Init
  // --------------------------
  (async ()=>{
    await openDB();
    updatePager();
    await renderCustomOnly();

    if ("serviceWorker" in navigator){
      try { await navigator.serviceWorker.register("./service-worker.js"); } catch(e) {}
    }
  })();
</script>
</body>
</html>
