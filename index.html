<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Poké Locator — Fast Log</title>

  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#111111">

  <!-- iPhone Home Screen icon support -->
  <link rel="apple-touch-icon" href="icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    :root { --pad: 12px; --radius: 12px; }
    body { font-family: -apple-system, system-ui, sans-serif; margin: 0; background:#0b0b0b; color:#fff; }
    header { padding: var(--pad); position: sticky; top:0; background: rgba(0,0,0,.88); backdrop-filter: blur(10px); border-bottom: 1px solid #222; z-index: 3; }
    h1 { font-size: 18px; margin:0; }
    main { padding: var(--pad); display:grid; gap:12px; }
    .card { background:#131313; border:1px solid #232323; border-radius: var(--radius); padding: var(--pad); }
    .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    input, select, button, textarea {
      font-size: 16px; border-radius: 10px; border:1px solid #2a2a2a; background:#1c1c1c; color:#fff;
      padding: 10px 12px;
    }
    textarea { width:100%; min-height: 60px; }
    button { cursor:pointer; }
    button.primary { background:#2a5bd7; border-color:#2a5bd7; }
    button.good { background:#1d7f43; border-color:#1d7f43; }
    button.warn { background:#a23a3a; border-color:#a23a3a; }
    button:disabled { opacity:.55; cursor:not-allowed; }
    .pill { padding: 6px 10px; border-radius: 999px; background:#1a1a1a; border:1px solid #2a2a2a; font-size: 13px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .small { font-size: 13px; opacity:.85; }
    .hint { font-size:12px; opacity:.8; line-height:1.35; }

    .grid { display:grid; grid-template-columns: 1fr; gap:10px; }
    @media (min-width: 860px){ .grid { grid-template-columns: 1fr 1fr; } }

    /* Suggestions dropdown */
    .suggestBox { position: relative; }
    .suggestList {
      position:absolute;
      top: calc(100% + 6px);
      left:0; right:0;
      background:#101010;
      border:1px solid #2a2a2a;
      border-radius: 12px;
      overflow:hidden;
      z-index: 10;
      display:none;
    }
    .suggestItem {
      padding: 10px 12px;
      border-top:1px solid #1f1f1f;
      display:flex;
      justify-content:space-between;
      gap:10px;
      align-items:center;
      font-size: 15px;
    }
    .suggestItem:first-child { border-top:0; }
    .suggestItem:hover { background:#171717; }
    .suggestRight { font-size:12px; opacity:.8; }
    .results { display:grid; gap:10px; }
    .resultItem { border:1px solid #2a2a2a; border-radius: 12px; padding:10px; background:#111; }
    .divider { border:0; border-top:1px solid #262626; margin:12px 0; }

    .toggle {
      display:flex; align-items:center; gap:8px;
      padding: 6px 10px; border-radius: 999px;
      background:#1a1a1a; border:1px solid #2a2a2a;
      font-size: 13px;
    }
    .toggle input { transform: scale(1.15); }

    .errBox {
      display:none;
      margin-top:10px;
      background:#2a1010;
      border:1px solid #6b1f1f;
      padding:10px;
      border-radius:12px;
      font-size:13px;
      white-space:pre-wrap;
    }
  </style>
</head>

<body>
<header>
  <div class="row" style="justify-content:space-between;">
    <h1>Poké Locator</h1>
    <span class="pill">Fast Log • Suggestions optional</span>
  </div>
</header>

<main class="grid">

  <section class="card">
    <h2 style="margin:0 0 10px 0; font-size:16px;">Log a card name (fast)</h2>

    <div class="suggestBox">
      <input id="name" autocomplete="off" placeholder="Type card name (e.g., Iono, Rare Candy)" style="width:100%;">
      <div id="suggestList" class="suggestList"></div>
    </div>

    <div class="row" style="margin-top:10px;">
      <label class="toggle" title="Suggestions call the API (text-only). Turn off for offline-only.">
        <input type="checkbox" id="suggestToggle" checked>
        Suggestions
      </label>

      <label class="toggle" title="Exact uses name:&quot;Iono&quot; ; otherwise contains (name:*iono*)">
        <input type="checkbox" id="exactToggle">
        Exact
      </label>

      <span id="status" class="pill">Idle</span>
    </div>

    <div class="row" style="margin-top:10px;">
      <input id="apiKey" placeholder="Optional API key (X-Api-Key)" style="flex:1;">
      <button id="saveKey">Save Key</button>
      <button id="clearKey" class="warn">Clear</button>
    </div>

    <div class="hint" style="margin-top:8px;">
      This app logs names instantly. Suggestions are text-only and limited to 12 results for speed.
    </div>

    <div id="errBox" class="errBox"></div>

    <hr class="divider">

    <div class="small" style="margin-bottom:6px;">Choose location</div>
    <div class="row">
      <button class="pillBtn" data-loc="A-SUPPORTER">A • Supporter</button>
      <button class="pillBtn" data-loc="A-ITEM">A • Item</button>
      <button class="pillBtn" data-loc="A-TOOL_STADIUM">A • Tool/Stadium</button>
      <button class="pillBtn" data-loc="A-ENERGY_LINES">A • Energy/Lines</button>
    </div>

    <div class="small" style="margin:10px 0 6px;">Bulk chunks (75-card)</div>
    <div class="row">
      <select id="bulkRow">
        <option>B</option><option>C</option><option>D</option><option>E</option>
      </select>
      <select id="bulkChunk"></select>
      <span class="pill mono" id="selectedLoc"></span>
    </div>

    <div class="row" style="margin-top:12px;">
      <button id="saveBtn" class="good">Save Name → Location</button>
      <button id="clearBtn">Clear</button>
    </div>
  </section>

  <section class="card">
    <h2 style="margin:0 0 10px 0; font-size:16px;">Custom names + Find</h2>

    <div class="row">
      <input id="customName" placeholder="Add a custom name (optional)" style="flex:1;">
      <button id="addCustom" class="primary">Add Custom</button>
    </div>

    <div class="row" style="margin-top:10px;">
      <input id="search" placeholder="Search logged names" style="flex:1;">
      <button id="runSearch" class="primary">Search</button>
    </div>

    <div class="row" style="margin-top:10px;">
      <button id="exportCsv">Export CSV</button>
      <button id="wipe" class="warn">Wipe Local Data</button>
      <span class="pill">Stored on this iPhone</span>
    </div>

    <hr class="divider">

    <div id="results" class="results"></div>
  </section>

</main>

<script>
  // --------------------------
  // Config
  // --------------------------
  const API_BASE = "https://api.pokemontcg.io/v2/cards";
  const DB_NAME = "poke_locator_db";
  const STORE_ENTRIES = "entries";
  const STORE_CUSTOM = "custom_names";

  // --------------------------
  // DOM
  // --------------------------
  const nameEl = document.getElementById("name");
  const suggestListEl = document.getElementById("suggestList");
  const statusEl = document.getElementById("status");
  const errBox = document.getElementById("errBox");

  const suggestToggleEl = document.getElementById("suggestToggle");
  const exactToggleEl = document.getElementById("exactToggle");

  const apiKeyInput = document.getElementById("apiKey");
  const saveKeyBtn = document.getElementById("saveKey");
  const clearKeyBtn = document.getElementById("clearKey");

  const bulkRowEl = document.getElementById("bulkRow");
  const bulkChunkEl = document.getElementById("bulkChunk");
  const selectedLocSpan = document.getElementById("selectedLoc");

  const saveBtn = document.getElementById("saveBtn");
  const clearBtn = document.getElementById("clearBtn");

  const customNameEl = document.getElementById("customName");
  const addCustomBtn = document.getElementById("addCustom");

  const searchEl = document.getElementById("search");
  const runSearchBtn = document.getElementById("runSearch");
  const resultsEl = document.getElementById("results");

  // --------------------------
  // Bulk chunks 01..14
  // --------------------------
  for (let i=1;i<=14;i++){
    const opt = document.createElement("option");
    opt.value = String(i).padStart(2,"0");
    opt.textContent = String(i).padStart(2,"0");
    bulkChunkEl.appendChild(opt);
  }

  // --------------------------
  // Location selection
  // --------------------------
  let selectedLoc = "";

  function bulkLoc(){ return bulkRowEl.value + bulkChunkEl.value; }
  function setSelectedLoc(v){
    selectedLoc = v;
    selectedLocSpan.textContent = selectedLoc || "No location";
  }

  bulkRowEl.addEventListener("change", ()=> setSelectedLoc(bulkLoc()));
  bulkChunkEl.addEventListener("change", ()=> setSelectedLoc(bulkLoc()));
  document.querySelectorAll(".pillBtn").forEach(btn=>{
    btn.addEventListener("click", ()=> setSelectedLoc(btn.dataset.loc));
  });
  setSelectedLoc(bulkLoc());

  // --------------------------
  // IndexedDB
  // --------------------------
  let db;

  function openDB(){
    return new Promise((resolve,reject)=>{
      const req = indexedDB.open(DB_NAME, 3);
      req.onupgradeneeded = ()=>{
        const d = req.result;
        if (!d.objectStoreNames.contains(STORE_ENTRIES)) {
          const s = d.createObjectStore(STORE_ENTRIES, { keyPath:"id", autoIncrement:true });
          s.createIndex("name","name",{unique:false});
          s.createIndex("loc","loc",{unique:false});
        }
        if (!d.objectStoreNames.contains(STORE_CUSTOM)) {
          const c = d.createObjectStore(STORE_CUSTOM, { keyPath:"id", autoIncrement:true });
          c.createIndex("name","name",{unique:false});
        }
      };
      req.onsuccess = ()=>{ db = req.result; resolve(db); };
      req.onerror = ()=>reject(req.error);
    });
  }

  function addToStore(storeName, obj){
    return new Promise((resolve,reject)=>{
      const tx = db.transaction(storeName,"readwrite");
      tx.objectStore(storeName).add(obj);
      tx.oncomplete = ()=>resolve();
      tx.onerror = ()=>reject(tx.error);
    });
  }

  function getAll(storeName){
    return new Promise((resolve,reject)=>{
      const tx = db.transaction(storeName,"readonly");
      const req = tx.objectStore(storeName).getAll();
      req.onsuccess = ()=>resolve(req.result);
      req.onerror = ()=>reject(req.error);
    });
  }

  async function wipeAll(){
    await new Promise((resolve,reject)=>{
      const tx = db.transaction(STORE_ENTRIES,"readwrite");
      const req = tx.objectStore(STORE_ENTRIES).clear();
      req.onsuccess = ()=>resolve();
      req.onerror = ()=>reject(req.error);
    });
    await new Promise((resolve,reject)=>{
      const tx = db.transaction(STORE_CUSTOM,"readwrite");
      const req = tx.objectStore(STORE_CUSTOM).clear();
      req.onsuccess = ()=>resolve();
      req.onerror = ()=>reject(req.error);
    });
  }

  // --------------------------
  // API key
  // --------------------------
  apiKeyInput.value = localStorage.getItem("poke_api_key") || "";
  saveKeyBtn.addEventListener("click", ()=>{
    localStorage.setItem("poke_api_key", apiKeyInput.value.trim());
    setStatus("Key saved");
  });
  clearKeyBtn.addEventListener("click", ()=>{
    localStorage.removeItem("poke_api_key");
    apiKeyInput.value = "";
    setStatus("Key cleared");
  });

  // --------------------------
  // Helpers
  // --------------------------
  function setStatus(s){ statusEl.textContent = s; }
  function showError(msg){
    errBox.style.display = "block";
    errBox.textContent = msg;
  }
  function clearError(){
    errBox.style.display = "none";
    errBox.textContent = "";
  }
  function normalize(s){ return (s||"").toLowerCase().replace(/\s+/g," ").trim(); }

  // Safe query sanitizer for lucene-ish syntax
  function sanitizeForQuery(s){
    return (s||"")
      .replace(/"/g,"")
      .replace(/\\/g,"\\\\")
      .replace(/:/g,"\\:")
      .trim();
  }

  // Build a fast query for suggestions (TEXT ONLY)
  function buildSuggestQuery(text){
    const exact = exactToggleEl.checked;
    const t = sanitizeForQuery(text);
    const words = t.split(/\s+/).filter(Boolean);

    if (!words.length) return "";
    if (exact) return `name:"${t}"`;
    if (words.length === 1) return `name:*${words[0]}*`;
    return words.map(w => `name:*${w}*`).join(" AND ");
  }

  async function fetchSuggestions(text){
    const q = buildSuggestQuery(text);
    if (!q) return [];

    const url = new URL(API_BASE);
    url.searchParams.set("q", q);
    url.searchParams.set("pageSize", "12");
    url.searchParams.set("page", "1");
    url.searchParams.set("orderBy", "name");

    // IMPORTANT for speed: no images, no big payload
    url.searchParams.set("select", "id,name,set,number");

    const headers = {};
    const key = (localStorage.getItem("poke_api_key") || "").trim();
    if (key) headers["X-Api-Key"] = key;

    const res = await fetch(url.toString(), { headers });
    const textBody = await res.text();
    let json = null;
    try { json = JSON.parse(textBody); } catch(e) {}

    if (!res.ok) {
      const detail = json?.message || json?.error || textBody || `HTTP ${res.status}`;
      throw new Error(`API ${res.status}: ${detail}`);
    }

    return json?.data || [];
  }

  // --------------------------
  // Suggestions rendering
  // --------------------------
  function hideSuggestions(){
    suggestListEl.style.display = "none";
    suggestListEl.innerHTML = "";
  }

  function showSuggestions(items){
    if (!items.length) { hideSuggestions(); return; }
    suggestListEl.innerHTML = "";
    for (const c of items) {
      const div = document.createElement("div");
      div.className = "suggestItem";
      const setId = c.set?.id ? c.set.id : "";
      const num = c.number ? c.number : "";
      div.innerHTML = `
        <div>${c.name}</div>
        <div class="suggestRight mono">${setId}${num ? " • #" + num : ""}</div>
      `;
      div.addEventListener("click", ()=>{
        nameEl.value = c.name;
        hideSuggestions();
        setStatus("Picked ✓");
      });
      suggestListEl.appendChild(div);
    }
    suggestListEl.style.display = "block";
  }

  // --------------------------
  // Local custom names (shown first in suggestions)
  // --------------------------
  async function getCustomMatches(prefix){
    const p = normalize(prefix);
    if (!p) return [];
    const customs = await getAll(STORE_CUSTOM);
    const matches = customs
      .map(c => c.name)
      .filter(n => normalize(n).includes(p))
      .slice(0, 6);
    return matches;
  }

  // --------------------------
  // Debounced suggestion engine
  // --------------------------
  let debounceTimer = null;
  let lastSuggestToken = 0;

  async function runSuggest(){
    clearError();

    const text = nameEl.value.trim();
    if (!suggestToggleEl.checked) { hideSuggestions(); return; }

    // guard: avoid spam + huge queries
    if (text.length < 2) { hideSuggestions(); setStatus("Idle"); return; }

    const token = ++lastSuggestToken;
    setStatus("Suggesting…");

    // Custom matches first (offline)
    const custom = await getCustomMatches(text);

    // If still short, don’t call API (keeps it snappy)
    if (text.length < 3) {
      const items = custom.map(n => ({ name: n, set:{id:"custom"}, number:"" }));
      showSuggestions(items);
      setStatus(custom.length ? "Custom suggestions" : "Type 3+ for API");
      return;
    }

    try {
      const apiItems = await fetchSuggestions(text);
      if (token !== lastSuggestToken) return; // ignore stale

      // Merge: customs first, then API de-duped by name
      const seen = new Set(custom.map(n => normalize(n)));
      const merged = [];

      for (const n of custom) merged.push({ name:n, set:{id:"custom"}, number:"" });
      for (const c of apiItems) {
        const key = normalize(c.name);
        if (seen.has(key)) continue;
        seen.add(key);
        merged.push(c);
        if (merged.length >= 12) break;
      }

      showSuggestions(merged);
      setStatus(merged.length ? "Suggestions ready" : "No suggestions");
    } catch (e) {
      if (token !== lastSuggestToken) return;
      setStatus("Suggest error");
      showError(String(e.message || e));
      hideSuggestions();
    }
  }

  nameEl.addEventListener("input", ()=>{
    if (debounceTimer) clearTimeout(debounceTimer);
    debounceTimer = setTimeout(runSuggest, 250);
  });

  // Hide suggestions when tapping elsewhere
  document.addEventListener("click", (e)=>{
    if (!e.target.closest(".suggestBox")) hideSuggestions();
  });

  // If Exact toggle changes, re-suggest quickly
  exactToggleEl.addEventListener("change", ()=>{
    if (debounceTimer) clearTimeout(debounceTimer);
    debounceTimer = setTimeout(runSuggest, 150);
  });
  suggestToggleEl.addEventListener("change", ()=>{
    hideSuggestions();
    if (suggestToggleEl.checked) runSuggest();
    else setStatus("Offline only");
  });

  // --------------------------
  // Save name (instant)
  // --------------------------
  async function saveName(){
    const name = nameEl.value.trim();
    if (!name) return alert("Type a name first.");
    if (!selectedLoc) return alert("Select a location first.");

    await addToStore(STORE_ENTRIES, {
      name,
      loc: selectedLoc,
      ts: new Date().toISOString()
    });

    setStatus(`Saved → ${selectedLoc}`);
    hideSuggestions();
  }

  saveBtn.addEventListener("click", saveName);

  nameEl.addEventListener("keydown", async (e)=>{
    if (e.key === "Enter") {
      e.preventDefault();
      await saveName();
    }
  });

  clearBtn.addEventListener("click", ()=>{
    nameEl.value = "";
    hideSuggestions();
    setStatus("Cleared");
    nameEl.focus();
  });

  // --------------------------
  // Custom name add
  // --------------------------
  addCustomBtn.addEventListener("click", async ()=>{
    const n = customNameEl.value.trim();
    if (!n) return alert("Enter a custom name.");
    await addToStore(STORE_CUSTOM, { name: n, created: new Date().toISOString() });
    customNameEl.value = "";
    setStatus("Custom added");
  });

  // --------------------------
  // Find logged entries
  // --------------------------
  function renderResults(rows){
    resultsEl.innerHTML = "";
    if (!rows.length) {
      resultsEl.innerHTML = `<div class="resultItem">No matches.</div>`;
      return;
    }

    // aggregate by name + loc
    const agg = new Map();
    for (const r of rows){
      const key = normalize(r.name) + "||" + r.loc;
      const prev = agg.get(key) || { name:r.name, loc:r.loc, qty:0, lastTs:r.ts };
      prev.qty += 1;
      if (r.ts > prev.lastTs) prev.lastTs = r.ts;
      agg.set(key, prev);
    }

    const list = Array.from(agg.values())
      .sort((a,b)=> a.name.localeCompare(b.name) || a.loc.localeCompare(b.loc));

    for (const it of list){
      const div = document.createElement("div");
      div.className = "resultItem";
      div.innerHTML = `
        <div style="display:flex;justify-content:space-between;gap:10px;align-items:center;">
          <div>
            <div style="font-weight:700;">${it.name}</div>
            <div class="small mono">Location: ${it.loc}</div>
          </div>
          <div class="pill mono">x${it.qty}</div>
        </div>
      `;
      resultsEl.appendChild(div);
    }
  }

  async function runFind(){
    const q = normalize(searchEl.value);
    const all = await getAll(STORE_ENTRIES);
    const hits = q ? all.filter(e => normalize(e.name).includes(q)) : all;
    renderResults(hits);
    setStatus(`Showing ${hits.length} logs`);
  }

  runSearchBtn.addEventListener("click", runFind);

  // --------------------------
  // Export / wipe
  // --------------------------
  document.getElementById("exportCsv").addEventListener("click", async ()=>{
    const entries = await getAll(STORE_ENTRIES);
    const customs = await getAll(STORE_CUSTOM);

    const header = ["type","name","loc","timestamp","notes"];
    const lines = [header.join(",")];

    for (const e of entries){
      const row = ["entry", e.name||"", e.loc||"", e.ts||"", ""]
        .map(v => `"${String(v).replaceAll('"','""')}"`);
      lines.push(row.join(","));
    }
    for (const c of customs){
      const row = ["custom", c.name||"", "", c.created||"", ""]
        .map(v => `"${String(v).replaceAll('"','""')}"`);
      lines.push(row.join(","));
    }

    const blob = new Blob([lines.join("\n")], { type:"text/csv" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "poke_locator_export.csv";
    a.click();
    URL.revokeObjectURL(url);
  });

  document.getElementById("wipe").addEventListener("click", async ()=>{
    if (confirm("This deletes ALL saved logs + custom names on this iPhone. Continue?")){
      await wipeAll();
      setStatus("Wiped");
      resultsEl.innerHTML = "";
      hideSuggestions();
    }
  });

  // --------------------------
  // Init
  // --------------------------
  (async ()=>{
    await openDB();
    setStatus("Ready");
    // Optional service worker registration
    if ("serviceWorker" in navigator){
      try { await navigator.serviceWorker.register("./service-worker.js"); } catch(e) {}
    }
  })();
</script>
</body>
</html>
